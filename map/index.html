<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>被害状況投稿マップ（詳細説明任意＆仮マーカー修正＆初期表示範囲）</title>
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    crossorigin=""
  />
  <style>
    #map { height: 400px; margin-bottom: 20px; }
    form { margin-bottom: 20px; }
    img { max-width: 100%; height: auto; display: block; margin-top: 10px; }
    #locationInfo { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>被害状況投稿マップ</h1>

  <div id="map"></div>

  <div id="locationInfo">地図をクリックして投稿場所を選択してください。</div>

  <form id="reportForm">
    <label>被害内容：
      <select id="damageType" required>
        <option value="" disabled selected>選択してください</option>
        <option value="flood">洪水・浸水（宅地や建物周辺の水没）</option>
        <option value="roadFlood">道路の冠水・寸断（通行障害）</option>
        <option value="landslide">土砂崩れ・地滑り</option>
        <option value="buildingDamage">建物の倒壊・損壊</option>
        <option value="other">その他</option>
      </select>
    </label>
    <br><br>
    <label>詳細説明（任意）：
      <textarea id="description" rows="4" cols="50"></textarea>
    </label>
    <br>
    <label>写真（1枚まで）：
      <input type="file" id="photo" accept="image/*" required>
    </label>
    <br>
    <button type="submit">投稿する</button>
  </form>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 最初に表示する範囲（南西と北東の座標）
    const bounds = [
      [36.96025, 136.69756], // 南西
      [37.21008, 136.77429]  // 北東
    ];
    map.fitBounds(bounds);

    let selectedLatLng = null;
    let tempMarker = null;

    const locationInfo = document.getElementById('locationInfo');

    let reports = JSON.parse(localStorage.getItem('damageReports') || '[]');

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const iconMap = {
      flood: new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      }),
      roadFlood: new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      }),
      landslide: new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      }),
      buildingDamage: new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-violet.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      }),
      other: new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      })
    };

    function addMarker(report) {
      const icon = iconMap[report.damageType] || iconMap.other;
      const marker = L.marker([report.lat, report.lng], { icon: icon }).addTo(map);
      let content = `<b>被害内容:</b> ${getDamageTypeLabel(report.damageType)}<br>`;
      if (report.description && report.description.trim() !== '') {
        content += `<b>詳細:</b> ${report.description}<br>`;
      }
      if (report.photoData) {
        content += `<img src="${report.photoData}" alt="被害写真" />`;
      }
      marker.bindPopup(content);
    }

    function getDamageTypeLabel(value) {
      const map = {
        flood: '洪水・浸水（宅地や建物周辺の水没）',
        roadFlood: '道路の冠水・寸断（通行障害）',
        landslide: '土砂崩れ・地滑り',
        buildingDamage: '建物の倒壊・損壊',
        other: 'その他'
      };
      return map[value] || value;
    }

    reports.forEach(addMarker);

    map.on('click', function(e) {
      selectedLatLng = e.latlng;

      if (tempMarker) {
        map.removeLayer(tempMarker);
      }
      tempMarker = L.marker(selectedLatLng, { icon: redIcon }).addTo(map);

      locationInfo.textContent = `選択位置：緯度 ${selectedLatLng.lat.toFixed(5)}, 経度 ${selectedLatLng.lng.toFixed(5)}`;
    });

    document.getElementById('reportForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!selectedLatLng) {
        alert('地図をクリックして投稿場所を選択してください。');
        return;
      }

      const damageType = document.getElementById('damageType').value;
      if (!damageType) {
        alert('被害内容を選択してください。');
        return;
      }

      const description = document.getElementById('description').value;
      const photoInput = document.getElementById('photo');
      const file = photoInput.files[0];

      if (!file) {
        alert('写真を選択してください。');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const photoData = event.target.result;

        const newReport = {
          lat: selectedLatLng.lat,
          lng: selectedLatLng.lng,
          damageType: damageType,
          description: description,
          photoData: photoData,
          timestamp: new Date().toISOString()
        };

        reports.push(newReport);
        localStorage.setItem('damageReports', JSON.stringify(reports));

        addMarker(newReport);

        alert('投稿されました！');

        document.getElementById('reportForm').reset();
        locationInfo.textContent = '地図をクリックして投稿場所を選択してください。';
        if (tempMarker) {
          map.removeLayer(tempMarker);
          tempMarker = null;
        }
        selectedLatLng = null;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
